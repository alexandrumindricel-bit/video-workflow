<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    /* editorial preset (ref C) */
    --green: #1F3B2D; --green-2: #2A4A3A; --cream: #F1EBDD; --gold: #D2BC82; --dim: #8FA596;
    /* depth preset (ref B) */
    --blue-1: #9BD8FF; --blue-2: #2F86F0; --blue-3: #1557C9;
    --glass: rgba(14, 18, 28, 0.78); --glass-border: rgba(255, 255, 255, 0.18);
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .el { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center;
        align-items: center; transform-origin: 50% 50%; will-change: transform, opacity; }
  .full { inset: 0; width: auto; }

  /* ---------- captions ---------- */
  #cap { position: absolute; left: 60px; right: 60px; display: flex; justify-content: center; }
  .cap-ed { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 62px; line-height: 1.12;
            background: var(--green); color: var(--cream); padding: 10px 22px 16px; text-align: center;
            max-width: 900px; letter-spacing: -0.01em; }
  .cap-ed .w { color: var(--dim); }
  .cap-ed .w.on { color: var(--cream); }
  .cap-ed .w.kw { font-style: italic; color: var(--gold); font-weight: 700; }
  .cap-ed .w.kw:not(.on) { opacity: .55; }
  .cap-ed.big { font-size: 96px; }

  .cap-dp { text-align: center; font-family: 'Montserrat', sans-serif; max-width: 960px; }
  .cap-dp .small { font-weight: 800; font-size: 50px; color: #fff; letter-spacing: -0.01em;
                   text-shadow: 0 4px 18px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.6); line-height: 1.05; }
  .cap-dp .hero { font-weight: 900; font-size: 150px; line-height: .95; text-transform: uppercase;
                  letter-spacing: -0.02em; display: inline-block;
                  background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 55%, var(--blue-3) 100%);
                  -webkit-background-clip: text; background-clip: text; color: transparent;
                  filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)) drop-shadow(0 2px 0 rgba(10,40,110,.7)); }
  .cap-dp .w { display: inline-block; margin: 0 .12em; }

  /* ---------- titles ---------- */
  .title { flex-direction: column; text-align: center; padding: 0 50px; }
  .line { overflow: hidden; display: block; padding: 0 .04em; }
  .line > span { display: inline-block; }
  .f-serif { font-family: 'Playfair Display', serif; font-weight: 400; text-transform: uppercase;
             letter-spacing: -0.03em; line-height: .9; }
  .f-heavy { font-family: 'Inter', sans-serif; font-weight: 900; text-transform: uppercase;
             letter-spacing: -0.045em; line-height: .88; }
  .f-italic { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
  .f-mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
  /* gradient text must sit on the animated span itself (background-clip:text ignores transformed children) */
  .f-depth, .f-depth-white { font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em;
             line-height: .92; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  .f-depth > span { background: linear-gradient(180deg, var(--blue-1), var(--blue-2) 55%, var(--blue-3));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .f-depth-white > span { background: linear-gradient(180deg, #fff, #c9ced6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ed .title-c { color: var(--cream); text-shadow: 0 6px 30px rgba(0,0,0,.35); }
  .ed .gold { color: var(--gold); }
  .boxed > span { background: var(--green); padding: .02em .14em .06em; }

  /* ---------- cards / UI ---------- */
  .card { display: flex; align-items: center; gap: 26px; padding: 26px 34px; border-radius: 28px; max-width: 900px; }
  .ed .card { background: var(--cream); color: #1d2a22; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  .dp .card { background: var(--glass); color: #fff; border: 1.5px solid var(--glass-border);
              box-shadow: 0 0 0 1px rgba(47,134,240,.25), 0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(47,134,240,.25); }
  .card .ico { width: 104px; height: 104px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
               font-size: 62px; flex: none; overflow: hidden; }
  .ed .card .ico { background: var(--green); color: var(--cream); }
  .dp .card .ico { background: linear-gradient(160deg, var(--blue-2), var(--blue-3)); }
  .card .ico img { width: 100%; height: 100%; object-fit: cover; }
  .card .tt { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 48px; line-height: 1.05; letter-spacing: -0.02em; }
  .card .st { font-family: 'JetBrains Mono', monospace; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-top: 8px; }

  .prompt { width: 900px; border-radius: 34px; padding: 22px 26px 26px 36px; display: flex; align-items: flex-end; gap: 20px; }
  .ed .prompt { background: #FBF8F1; color: #1d2a22; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  .dp .prompt { background: var(--glass); color: #fff; border: 1.5px solid var(--glass-border); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .prompt .lbl { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: .2em; opacity: .55; text-transform: uppercase; margin-bottom: 8px; }
  .prompt .txt { font-family: 'Inter', sans-serif; font-size: 42px; font-weight: 600; line-height: 1.2; min-height: 50px; }
  .prompt .caret { display: inline-block; width: 3px; height: 44px; background: currentColor; vertical-align: -6px; margin-left: 3px; }
  .prompt .send { width: 76px; height: 76px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
                  font-family: 'Inter'; font-weight: 800; font-size: 40px; }
  .ed .prompt .send { background: var(--green); color: var(--cream); }
  .dp .prompt .send { background: var(--blue-2); color: #fff; }

  .strike { position: relative; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 120px; letter-spacing: -0.04em;
            text-transform: uppercase; padding: 0 20px; }
  .ed .strike { color: var(--cream); text-shadow: 0 6px 30px rgba(0,0,0,.35); }
  .dp .strike { color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.55); }
  .strike .bar { position: absolute; left: 0; top: 52%; height: 16px; background: #E5383B; border-radius: 8px;
                 transform-origin: 0 50%; width: 100%; transform: rotate(-6deg) scaleX(0); box-shadow: 0 3px 10px rgba(0,0,0,.4); }

  .counter { flex-direction: column; text-align: center; }
  .counter .num { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 210px; line-height: .9; letter-spacing: -0.04em;
                  font-variant-numeric: tabular-nums; }
  .counter .lab { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 64px; margin-top: 4px; }
  .ed .counter .num { background: var(--green); color: var(--cream); padding: 6px 34px 16px; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 170px; letter-spacing: 0; }
  .ed .counter .lab { color: var(--cream); font-family: 'Playfair Display'; font-style: italic; font-weight: 400; text-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .dp .counter .num { background: linear-gradient(180deg, var(--blue-1), var(--blue-2) 55%, var(--blue-3)); -webkit-background-clip: text;
                      background-clip: text; color: transparent; filter: drop-shadow(0 10px 16px rgba(0,0,0,.5)); }
  .dp .counter .lab { color: #e9ecf1; text-shadow: 0 4px 16px rgba(0,0,0,.6); }

  .step { display: flex; align-items: center; gap: 24px; }
  .step .badge { width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                 font-family: 'Inter'; font-weight: 800; font-size: 56px; flex: none; }
  .ed .step .badge { background: var(--green); color: var(--cream); border: 3px solid var(--cream); }
  .dp .step .badge { background: rgba(10,14,24,.75); color: #fff; border: 4px solid var(--blue-2); box-shadow: 0 0 24px rgba(47,134,240,.6); }
  .step .lbl { font-family: 'Inter'; font-weight: 800; font-size: 60px; letter-spacing: -0.02em; padding: 12px 26px; border-radius: 18px; }
  .ed .step .lbl { background: var(--cream); color: var(--green); }
  .dp .step .lbl { background: var(--glass); color: #fff; border: 1.5px solid var(--glass-border); }

  .list { flex-direction: column; align-items: stretch; gap: 16px; width: 860px; }
  .list .it { display: flex; align-items: center; gap: 20px; padding: 18px 26px; border-radius: 20px; font-family: 'Inter'; font-weight: 700; font-size: 44px; }
  .ed .list .it { background: var(--cream); color: var(--green); }
  .dp .list .it { background: var(--glass); color: #fff; border: 1.5px solid var(--glass-border); }
  .list .ck { width: 52px; height: 52px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; }
  .ed .list .ck { background: var(--green); color: var(--cream); }
  .dp .list .ck { background: var(--blue-2); color: #fff; }

  .stat { flex-direction: column; text-align: center; }
  .stat .v { font-family: 'Inter'; font-weight: 900; font-size: 230px; line-height: .85; letter-spacing: -0.05em; }
  .stat .l { font-family: 'Inter'; font-weight: 700; font-size: 52px; margin-top: 16px; }
  .ed .stat .v { color: var(--cream); text-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .ed .stat .l { font-family: 'Playfair Display'; font-style: italic; font-weight: 400; color: var(--gold); text-shadow: 0 4px 20px rgba(0,0,0,.5); font-size: 64px; }
  .dp .stat .v { background: linear-gradient(180deg, var(--blue-1), var(--blue-2) 55%, var(--blue-3)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 16px rgba(0,0,0,.5)); }
  .dp .stat .l { color: #fff; text-shadow: 0 4px 16px rgba(0,0,0,.6); }

  .comment { flex-direction: column; align-items: center; gap: 18px; }
  .cta { font-family: 'Inter'; font-weight: 800; font-size: 50px; text-align: center; line-height: 1.12; padding: 18px 30px; border-radius: 18px; max-width: 860px; }
  .ed .cta { background: #fff; color: #111; }
  .dp .cta { background: #fff; color: #111; }
  .bubble { display: flex; align-items: center; gap: 18px; background: #fff; color: #111; border-radius: 40px; padding: 14px 28px 14px 14px;
            font-family: 'Inter'; font-size: 40px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); min-width: 420px; }
  .bubble .av { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #2F86F0, #1F3B2D); flex: none; }
  .bubble.reply { font-size: 34px; min-width: 0; align-self: center; margin-left: 160px; }

  .follow { display: flex; align-items: center; gap: 22px; background: rgba(255,255,255,.96); color: #111; border-radius: 26px; padding: 20px 28px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .follow .av { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #2F86F0, #1F3B2D); flex: none; overflow: hidden; }
  .follow .av img { width: 100%; height: 100%; object-fit: cover; }
  .follow .h { font-family: 'Inter'; font-weight: 800; font-size: 42px; }
  .follow .tg { font-family: 'Inter'; font-weight: 500; font-size: 30px; opacity: .6; }
  .follow .btn { margin-left: 26px; font-family: 'Inter'; font-weight: 800; font-size: 32px; padding: 14px 28px; border-radius: 40px; }
  .ed .follow .btn { background: var(--green); color: var(--cream); }
  .dp .follow .btn { background: var(--blue-2); color: #fff; }

  .image img { max-width: 860px; max-height: 640px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .ed .image img { border: 6px solid var(--cream); }
  .dp .image img { border: 2px solid var(--glass-border); }

  .label { font-family: 'JetBrains Mono', monospace; font-size: 28px; letter-spacing: .22em; text-transform: uppercase; color: #fff;
           opacity: .85; text-shadow: 0 2px 10px rgba(0,0,0,.6); }

  .flash { background: #fff; }
  .leak { background:
      radial-gradient(60% 45% at 20% 30%, rgba(255,150,40,.95), rgba(255,90,0,0) 70%),
      radial-gradient(55% 50% at 80% 70%, rgba(255,60,20,.85), rgba(255,60,0,0) 70%),
      radial-gradient(80% 60% at 50% 50%, rgba(255,200,120,.6), rgba(255,140,0,0) 75%); }
  .frame { border: 3px solid rgba(241,235,221,.85); position: absolute; inset: 70px 50px 330px 50px; }

  /* ---------- bold preset (white + yellow keyword) ---------- */
  .cap-bd { text-align: center; font-family: 'Inter', sans-serif; max-width: 980px; }
  .cap-bd .small { font-weight: 800; font-size: 58px; color: #fff; letter-spacing: -0.02em; line-height: 1.08;
                   text-shadow: 0 3px 14px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.7); }
  .cap-bd .hero { font-weight: 900; font-size: 128px; line-height: .95; color: #F7E15A; letter-spacing: -0.045em; display: inline-block;
                  text-shadow: 0 6px 22px rgba(0,0,0,.55); }
  .cap-bd .w { display: inline-block; margin: 0 .11em; }
  .f-bold { font-family: 'Inter'; font-weight: 900; color: #fff; letter-spacing: -0.045em; line-height: .95; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .f-yellow { font-family: 'Inter'; font-weight: 900; color: #F7E15A; letter-spacing: -0.045em; line-height: .95; text-shadow: 0 6px 24px rgba(0,0,0,.5); }

  /* ---------- effect elements ---------- */
  .orbit-card { position: absolute; left: 0; top: 0; width: 230px; height: 300px; border-radius: 26px; overflow: hidden; background: #15171c;
                border: 3px solid rgba(255,255,255,.85); box-shadow: 0 18px 40px rgba(0,0,0,.45);
                display: flex; flex-direction: column; justify-content: flex-end; }
  .orbit-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .orbit-card .oc-ico { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-size: 96px; }
  .orbit-card .oc-t { position: relative; font-family: 'Inter'; font-weight: 800; font-size: 30px; color: #fff; padding: 16px;
                      background: linear-gradient(transparent, rgba(0,0,0,.75)); line-height: 1.05; }

  .note { position: absolute; width: 270px; padding: 26px 24px 30px; font-family: 'Inter'; font-weight: 800; font-size: 34px;
          line-height: 1.08; letter-spacing: -0.02em; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .note.paper { background: #F4EFE3; color: #1b1b1b; }
  .note.paper::before { content: ''; position: absolute; top: -16px; left: 50%; width: 110px; height: 34px; margin-left: -55px;
                        background: rgba(240,225,150,.75); transform: rotate(-3deg); }
  .note.screen { background: #111317; color: #fff; border: 2px solid rgba(255,255,255,.25); border-radius: 18px; font-size: 30px; }
  .note.screen .nh { font-family: 'JetBrains Mono'; font-size: 18px; opacity: .55; letter-spacing: .12em; margin-bottom: 10px; text-transform: uppercase; }
  .note img { width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; }

  .app { width: 940px; border-radius: 30px; background: #FBF9F4; color: #1d1d1d; box-shadow: 0 24px 60px rgba(0,0,0,.45); overflow: hidden; }
  .app .bar { height: 54px; background: #EFECE4; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .app .dot { width: 18px; height: 18px; border-radius: 50%; }
  .app .hd { font-family: 'Inter'; font-weight: 800; font-size: 34px; padding: 22px 32px 6px; display: flex; align-items: center; gap: 12px; }
  .app .hd .spark { color: #D97757; font-size: 40px; }
  .app .tiles { display: flex; gap: 16px; padding: 18px 32px; align-items: flex-end; }
  .app .tile { width: 132px; height: 186px; border-radius: 16px; background: linear-gradient(160deg, #3a3f4a, #16181d); position: relative; overflow: hidden;
               display: flex; align-items: flex-end; justify-content: center; color: #fff; font-family: 'Inter'; font-weight: 700; font-size: 20px; padding-bottom: 12px; }
  .app .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .app .tile span { position: relative; }
  .app .chip { margin-left: auto; align-self: flex-start; background: #F7E15A; color: #111; font-family: 'Inter'; font-weight: 900; font-size: 24px;
               padding: 8px 16px; border-radius: 10px; letter-spacing: .02em; }
  .app .inp { margin: 8px 32px 28px; border: 2px solid #E3DED3; border-radius: 22px; padding: 18px 22px; font-family: 'Inter'; font-size: 32px;
              font-weight: 600; min-height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .app .inp .sb { width: 54px; height: 54px; border-radius: 14px; background: #D97757; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; }

  .phone { position: absolute; width: 400px; height: 820px; border-radius: 64px; background: #0b0b0d; padding: 16px;
           box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 3px #2b2b30; }
  .phone .scr { width: 100%; height: 100%; border-radius: 50px; background: #121216; overflow: hidden; position: relative; padding: 70px 20px 20px; box-sizing: border-box;
                display: flex; flex-direction: column; gap: 14px; }
  .phone .notch { position: absolute; top: 18px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .phone .ph { font-family: 'Inter'; font-weight: 800; color: #fff; font-size: 28px; text-align: center; margin-bottom: 10px; }
  .phone .msg { max-width: 78%; padding: 14px 18px; border-radius: 24px; font-family: 'Inter'; font-weight: 600; font-size: 26px; line-height: 1.2; }
  .phone .msg.me { align-self: flex-end; background: #2F86F0; color: #fff; border-bottom-right-radius: 8px; }
  .phone .msg.them { align-self: flex-start; background: #2A2A31; color: #fff; border-bottom-left-radius: 8px; }
  .phone .btn { align-self: center; margin-top: auto; background: #fff; color: #111; font-family: 'Inter'; font-weight: 800; font-size: 26px; padding: 14px 28px; border-radius: 30px; }

  .chart { width: 920px; border-radius: 30px; padding: 28px 34px; box-sizing: border-box; }
  .ed .chart, .dp .chart { background: rgba(14,16,20,.82); border: 1.5px solid rgba(255,255,255,.16); color: #fff; }
  .chart .ct { font-family: 'Inter'; font-weight: 800; font-size: 40px; margin-bottom: 8px; }
  .chart svg text { font-family: 'JetBrains Mono'; font-size: 24px; fill: rgba(255,255,255,.6); }
  .chart .tag { position: absolute; background: #F7E15A; color: #111; font-family: 'Inter'; font-weight: 900; font-size: 30px; padding: 8px 16px; border-radius: 12px; white-space: nowrap; }

  .backdrop { position: absolute; inset: 0; overflow: hidden; }
  .bd-app { background: #F6F4EF; }
  .bd-app .band { height: 560px; background: linear-gradient(135deg, #5B4BFF, #9B6CFF); padding: 120px 70px 0; box-sizing: border-box; color: #fff; }
  .bd-app .band .lbl { font-family: 'JetBrains Mono'; font-size: 30px; letter-spacing: .2em; opacity: .8; text-transform: uppercase; }
  .bd-app .band .tm { font-family: 'Inter'; font-weight: 900; font-size: 190px; letter-spacing: -0.05em; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .bd-app .band .tt { font-family: 'Inter'; font-weight: 700; font-size: 44px; margin-top: 4px; }
  .bd-app .rows { padding: 40px 70px; display: flex; flex-direction: column; gap: 22px; }
  .bd-app .row { display: flex; align-items: center; gap: 22px; font-family: 'Inter'; font-weight: 700; font-size: 40px; color: #222; background: #fff;
                 border-radius: 20px; padding: 24px 28px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .bd-app .row .cb { width: 40px; height: 40px; border-radius: 10px; border: 3px solid #5B4BFF; flex: none; }
  .bd-paper { background-color: #F3EEE2;
              background-image: linear-gradient(rgba(90,120,160,.16) 2px, transparent 2px), linear-gradient(90deg, rgba(90,120,160,.16) 2px, transparent 2px);
              background-size: 60px 60px; }

  .tiles-row { display: flex; gap: 10px; }
  .tl { width: 150px; height: 180px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono'; font-weight: 500;
        font-size: 130px; box-shadow: 0 8px 18px rgba(0,0,0,.35); border-radius: 8px; }
  .tl.d { background: #1c1c1c; color: #F4EFE3; }
  .tl.l { background: #F4EFE3; color: #1c1c1c; }

  .glass { position: relative; font-family: 'Inter'; font-weight: 900; letter-spacing: -0.05em; line-height: .9; text-transform: uppercase; text-align: center; }
  .glass .g1 { color: rgba(255,255,255,.16); -webkit-text-stroke: 3px rgba(255,255,255,.75); text-shadow: 0 0 40px rgba(255,255,255,.25), 0 20px 40px rgba(0,0,0,.25); }
  .glass .g2 { position: absolute; inset: 0; color: transparent; -webkit-background-clip: text; background-clip: text;
               background-image: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.9) 48%, transparent 60%); background-size: 250% 100%; }

  .cover { position: absolute; left: 0; right: 0; text-align: center; }
  .cover .iss { font-family: 'JetBrains Mono'; font-size: 26px; letter-spacing: .3em; text-transform: uppercase; color: #F4EFE3; opacity: .85; }
  .cover .mast { font-family: 'Playfair Display'; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: .85; color: #F4EFE3;
                 text-shadow: 0 8px 30px rgba(0,0,0,.3); white-space: nowrap; }
  .cover .mast .ch { display: inline-block; }
  .cover .lines { position: absolute; left: 60px; text-align: left; font-family: 'Playfair Display'; font-style: italic; font-size: 46px; color: #F4EFE3;
                  text-shadow: 0 4px 16px rgba(0,0,0,.5); line-height: 1.1; max-width: 420px; }

  .checklist { width: 860px; border-radius: 28px; padding: 26px 30px; box-sizing: border-box; background: rgba(16,18,22,.86); border: 1.5px solid rgba(255,255,255,.15); color: #fff; }
  .checklist .ch-h { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-bottom: 16px; }
  .checklist .ci { display: flex; align-items: center; gap: 20px; font-family: 'Inter'; font-weight: 700; font-size: 42px; padding: 12px 0; }
  .checklist .bx { width: 50px; height: 50px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); flex: none; position: relative; box-sizing: border-box; }
  .checklist .bx svg { position: absolute; inset: -3px; }
  .doodle svg { overflow: visible; }

  /* ---------- 3D product (mindricel.ro) ---------- */
  .p3d { position: absolute; perspective: 1500px; }
  .p3d .glow { position: absolute; left: 50%; top: 46%; width: 120%; height: 95%; transform: translate(-50%, -50%); border-radius: 50%;
               background: radial-gradient(closest-side, var(--pglow, rgba(247,225,90,.55)), rgba(247,225,90,0) 75%); }
  .p3d .stage { position: absolute; inset: 0; transform-style: preserve-3d; }
  .p3d .lay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; backface-visibility: visible; }
  .p3d .card3d { position: absolute; inset: 6% 8%; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.9); }
  .p3d .card3d img { width: 100%; height: 100%; object-fit: cover; }
  .p3d .shine { position: absolute; inset: 0; pointer-events: none;
                -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
                background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 62%); background-size: 300% 100%; }
  .p3d .shadow { position: absolute; left: 50%; bottom: -2%; width: 62%; height: 8%; transform: translateX(-50%); border-radius: 50%;
                 background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .p3d .refl { position: absolute; left: 0; right: 0; top: 96%; height: 100%; opacity: .2; pointer-events: none;
               -webkit-mask-image: linear-gradient(rgba(0,0,0,.85), transparent 35%); }
  .p3d .refl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleY(-1); }
  .pinfo { position: absolute; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .pinfo .pn { font-family: 'Inter'; font-weight: 900; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em; color: #fff; text-transform: uppercase;
               text-shadow: 0 4px 18px rgba(0,0,0,.6); max-width: 520px; }
  .pinfo .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pinfo .pr { background: #F7E15A; color: #111; font-family: 'Inter'; font-weight: 900; font-size: 46px; padding: 6px 18px 8px; border-radius: 14px; letter-spacing: -0.02em; }
  .ed .pinfo .pr { background: var(--green); color: var(--cream); }
  .pinfo .sz { background: rgba(255,255,255,.95); color: #111; font-family: 'Inter'; font-weight: 800; font-size: 28px; padding: 6px 14px; border-radius: 10px; }
  .pinfo .site { font-family: 'JetBrains Mono'; font-size: 24px; letter-spacing: .16em; color: #fff; opacity: .9; text-shadow: 0 2px 10px rgba(0,0,0,.7); text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* Deterministic frame renderer: window.renderAt(t) draws the state at time t (seconds).
   Nothing depends on wall-clock time, so every frame is reproducible. */
const ease = {
  out: p => 1 - Math.pow(1 - p, 3),
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normW = w => w.toLowerCase().replace(/[^\p{L}\p{N}']/gu, '');

let S = null; // state

window.init = async (data) => {
  const { storyboard: sb, words, layout } = data;
  const LAYER = data.layer || 'front';
  const style = sb.style === 'depth' ? 'dp' : sb.style === 'bold' ? 'bd' : 'ed';
  document.body.className = style === 'bd' ? 'dp bd' : style;
  const face = layout.face || { x: 340, y: 600, w: 400, h: 400 };
  const fcx = face.x + face.w / 2, fcy = face.y + face.h / 2;
  await document.fonts.ready;
  const stage = document.getElementById('stage');
  const Z = layout.zones;
  const zones = {
    top: [Z.top.y0, Math.max(Z.top.y1, Z.top.y0 + 380)],  // may overlap the top of the hair, like the references
    lower: [Z.captions_y - 470, Z.captions_y - 50],
    center: [700, 1250],
  };
  const capY = sb.captions?.y ?? Z.captions_y;

  // ---- build elements (only those on this layer; orbit lives on both)
  const BACK_TYPES = new Set(['backdrop', 'glass', 'cover', 'wall']);
  const layerOf = el => el.type === 'orbit' ? 'both' : (el.layer || (BACK_TYPES.has(el.type) ? 'back' : 'front'));
  const mine = (sb.elements || []).filter(el => layerOf(el) === 'both' || layerOf(el) === LAYER);
  const els = mine.map((el, k) => {
    const n = document.createElement('div');
    n.className = 'el';
    const T = el.type;
    const rnd = (i => () => { i = (i * 16807) % 2147483647; return (i - 1) / 2147483646; })(1000 + k * 7919);
    if (T === 'title') {
      n.classList.add('title');
      n.innerHTML = el.lines.map(l => {
        const f = l.font || (style === 'dp' ? 'depth' : style === 'bd' ? 'bold' : 'serif');
        const sz = l.size || ({serif: 210, heavy: 170, italic: 170, mono: 34, depth: 190, 'depth-white': 150, bold: 150, yellow: 170}[f] || 160);
        const cls = ['line', 'f-' + f, l.gold ? 'gold' : '', l.boxed ? 'boxed' : '', style === 'ed' && f !== 'mono' ? 'title-c' : ''].join(' ');
        const inner = (el.anim === 'drop')
          ? [...l.text].map(ch => `<span class="ch">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('')
          : `<span>${esc(l.text)}</span>`;
        return `<div class="${cls}" style="font-size:${sz}px;${f === 'mono' ? 'color:' + (style === 'ed' ? 'var(--cream)' : '#fff') + ';opacity:.8' : ''}">${inner}</div>`;
      }).join('');
    } else if (T === 'card') {
      const ico = el.image ? `<img src="${esc(el.image)}">` : esc(el.icon || '★');
      n.innerHTML = `<div class="card"><div class="ico">${ico}</div><div><div class="tt">${esc(el.title || '')}</div>${el.subtitle ? `<div class="st">${esc(el.subtitle)}</div>` : ''}</div></div>`;
    } else if (T === 'prompt') {
      n.innerHTML = `<div class="prompt"><div style="flex:1"><div class="lbl">${esc(el.label || 'Prompt')}</div><div class="txt"><span class="ty"></span><span class="caret"></span></div></div><div class="send">↑</div></div>`;
    } else if (T === 'strike') {
      n.innerHTML = `<div class="strike" style="${el.size ? 'font-size:' + el.size + 'px' : ''}">${esc(el.text)}<div class="bar"></div></div>`;
    } else if (T === 'counter') {
      n.classList.add('counter');
      n.innerHTML = `<div class="num"></div>${el.label ? `<div class="lab">${esc(el.label)}</div>` : ''}`;
    } else if (T === 'step') {
      n.innerHTML = `<div class="step"><div class="badge">${esc(el.n)}</div><div class="lbl">${esc(el.text || '')}</div></div>`;
    } else if (T === 'list') {
      n.classList.add('list');
      n.innerHTML = el.items.map(it => `<div class="it"><div class="ck">✓</div><div>${esc(it.text ?? it)}</div></div>`).join('');
    } else if (T === 'stat') {
      n.classList.add('stat');
      n.innerHTML = `<div class="v">${esc(el.value)}</div>${el.label ? `<div class="l">${esc(el.label)}</div>` : ''}`;
    } else if (T === 'comment') {
      n.classList.add('comment');
      n.innerHTML = `${el.cta ? `<div class="cta">${esc(el.cta)}</div>` : ''}<div class="bubble"><div class="av"></div><span class="ty"></span></div>${el.reply ? `<div class="bubble reply"><div class="av" style="width:48px;height:48px"></div>${esc(el.reply)}</div>` : ''}`;
    } else if (T === 'follow') {
      n.innerHTML = `<div class="follow"><div class="av">${el.avatar ? `<img src="${esc(el.avatar)}">` : ''}</div><div><div class="h">${esc(el.handle)}</div>${el.tagline ? `<div class="tg">${esc(el.tagline)}</div>` : ''}</div><div class="btn">${esc(el.button || 'Follow')}</div></div>`;
    } else if (T === 'image') {
      n.classList.add('image');
      n.innerHTML = `<img src="${esc(el.src)}">`;
    } else if (T === 'label') {
      n.innerHTML = `<div class="label">${esc(el.text)}</div>`;
    } else if (T === 'flash' || T === 'leak') {
      n.className = 'el full ' + T;
      if (el.color) n.style.background = el.color;
    } else if (T === 'frame') {
      n.className = 'el full';
      n.innerHTML = '<div class="frame"></div>';
    } else if (T === 'orbit') {
      n.className = 'el full';
      n.innerHTML = el.items.map(it => {
        const o = typeof it === 'string' ? { text: it } : it;
        return `<div class="orbit-card">${o.image ? `<img src="${esc(o.image)}">` : ''}${o.icon ? `<div class="oc-ico">${esc(o.icon)}</div>` : ''}${o.text ? `<div class="oc-t">${esc(o.text)}</div>` : ''}</div>`;
      }).join('');
    } else if (T === 'wall') {
      n.className = 'el full';
      // scattered slots over the upper 62% of the frame, skipping the face (the person covers the rest: back layer)
      const slots = [];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
        const x = 40 + c * 340 + (rnd() - .5) * 60, y = 90 + r * 250 + (rnd() - .5) * 50;
        const overFace = x + 270 > face.x - 40 && x < face.x + face.w + 40 && y + 220 > face.y - face.h * 0.5 && y < face.y + face.h + 40;
        if (!overFace) slots.push([x, y]);
      }
      n.innerHTML = el.items.map((it, j) => {
        const o = typeof it === 'string' ? { text: it } : it;
        const [x, y] = slots[j % slots.length];
        const kind = el.kind || 'paper';
        return `<div class="note ${kind}" style="left:${x}px;top:${y}px;--r:${((rnd() - .5) * 12).toFixed(1)}deg">${kind === 'screen' && o.head ? `<div class="nh">${esc(o.head)}</div>` : ''}${o.image ? `<img src="${esc(o.image)}">` : ''}${esc(o.text || '')}</div>`;
      }).join('');
    } else if (T === 'app') {
      n.innerHTML = `<div class="app"><div class="bar"><div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FEBC2E"></div><div class="dot" style="background:#28C840"></div></div>
        <div class="hd"><span class="spark">✻</span>${esc(el.title || 'Claude')}</div>
        <div class="tiles">${(el.tiles || []).map(tl => { const o = typeof tl === 'string' ? { text: tl } : tl; return `<div class="tile">${o.image ? `<img src="${esc(o.image)}">` : ''}<span>${esc(o.text || '')}</span></div>`; }).join('')}${el.chip ? `<div class="chip">${esc(el.chip)}</div>` : ''}</div>
        <div class="inp"><span class="ty"></span><div class="sb">↑</div></div></div>`;
    } else if (T === 'phone') {
      n.className = 'el full';
      const side = el.side || (fcx > 540 ? 'left' : 'right');
      const x = side === 'left' ? 40 : 1080 - 440, y = el.y ?? 430;
      n.innerHTML = `<div class="phone" style="left:${x}px;top:${y}px;transform-origin:${side === 'left' ? '0' : '100%'} 50%"><div class="scr"><div class="notch"></div>${el.title ? `<div class="ph">${esc(el.title)}</div>` : ''}${(el.messages || []).map(m => `<div class="msg ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}</div>`).join('')}${el.button ? `<div class="btn">${esc(el.button)}</div>` : ''}</div></div>`;
    } else if (T === 'chart') {
      const vals = el.values || [2, 3, 2.6, 4, 5.2, 6.8, 9];
      const labels = el.labels || ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const cw = 850, chh = 330, mx = Math.max(...vals) * 1.1;
      const pts = vals.map((v, i) => [20 + i * (cw - 40) / (vals.length - 1), chh - 20 - (v / mx) * (chh - 50)]);
      const d = 'M' + pts.map(p => p.map(q => q.toFixed(1)).join(',')).join(' L');
      n.innerHTML = `<div class="chart" style="position:relative">${el.title ? `<div class="ct">${esc(el.title)}</div>` : ''}
        <svg width="${cw}" height="${chh + 40}">${[0, 1, 2, 3].map(i => `<line x1="0" x2="${cw}" y1="${30 + i * 90}" y2="${30 + i * 90}" stroke="rgba(255,255,255,.12)" stroke-dasharray="6 8"/>`).join('')}
        <path class="ln" d="${d}" fill="none" stroke="${el.color || '#F7E15A'}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="pt" r="14" fill="${el.color || '#F7E15A'}"/>
        ${labels.map((l, i) => `<text x="${20 + i * (cw - 40) / (labels.length - 1)}" y="${chh + 30}" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>
        ${el.tag ? `<div class="tag">${esc(el.tag)}</div>` : ''}</div>`;
      n.dataset.pts = JSON.stringify(pts);
    } else if (T === 'backdrop') {
      n.className = 'el full';
      const kind = el.kind || 'app';
      if (kind === 'app') n.innerHTML = `<div class="backdrop bd-app"><div class="band"><div class="lbl">${esc(el.label || 'Focus session')}</div><div class="tm"></div><div class="tt">${esc(el.title || '')}</div></div><div class="rows">${(el.items || []).map(i => `<div class="row"><div class="cb"></div>${esc(i)}</div>`).join('')}</div></div>`;
      else if (kind === 'paper') n.innerHTML = `<div class="backdrop bd-paper"><svg width="1080" height="1920">${[0, 1, 2].map(i => { const y = 250 + i * 520 + rnd() * 120; let p = `M${80 + rnd() * 80},${y}`; for (let k2 = 0; k2 < 14; k2++) p += ` L${120 + k2 * 60 + rnd() * 30},${y + (k2 % 2 ? -110 : 110) * (0.6 + rnd() * .4)}`; return `<path d="${p}" stroke="rgba(247,225,90,.85)" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; }).join('')}</svg></div>`;
      else if (kind === 'image') n.innerHTML = `<div class="backdrop"><img src="${esc(el.src)}" style="width:100%;height:100%;object-fit:cover"></div>`;
      else if (kind === 'gradient') n.innerHTML = `<div class="backdrop" style="background:radial-gradient(120% 80% at 30% 20%, ${(el.colors || ['#2F86F0', '#0B1530']).join(',')})"></div>`;
      else n.innerHTML = `<div class="backdrop" style="background:${esc(el.color || '#111')}"></div>`;
    } else if (T === 'doodle') {
      n.className = 'el full doodle';
      n.innerHTML = `<svg width="1080" height="1920"></svg>`;
    } else if (T === 'tiles') {
      n.innerHTML = `<div class="tiles-row">${[...String(el.text)].map((ch, j) => `<div class="tl ${j % 2 ? 'l' : 'd'}" style="transform:rotate(${((rnd() - .5) * 8).toFixed(1)}deg)">${esc(ch)}</div>`).join('')}</div>`;
    } else if (T === 'glass') {
      n.innerHTML = `<div class="glass" style="font-size:${el.size || 300}px"><div class="g1">${esc(el.text)}</div><div class="g2">${esc(el.text)}</div></div>`;
    } else if (T === 'cover') {
      n.className = 'el full';
      n.innerHTML = `<div class="cover" style="top:${el.y ?? 110}px">${el.issue ? `<div class="iss">${esc(el.issue)}</div>` : ''}<div class="mast" style="font-size:${el.size || 300}px">${[...el.text].map(ch => `<span class="ch">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('')}</div></div>${el.lines ? `<div class="cover lines" style="top:${el.lines_y ?? 1150}px">${el.lines.map(esc).join('<br>')}</div>` : ''}`;
    } else if (T === 'product3d') {
      // 3D product: cut-out views turn like a turntable, extruded (stacked layers) for thickness
      n.className = 'el full';
      const m = el._meta || {};
      const views = (el._views || []).length ? el._views : [];
      const mode = el.mode || (m.quality === 'low' || !views.length ? 'card' : 'cutout');
      el._mode = mode;
      const side = el.pos === 'hero' ? 'center' : el.pos === 'top' ? 'center' : (el.side || (fcx > 540 ? 'left' : 'right'));
      // never cover the face: side = next to the face, hero = between chin and the platform UI, top = above the head
      const fr = face.x + face.w, fl = face.x;
      let box;
      if (el.pos === 'hero') {
        const y = Math.round(face.y + face.h * 1.02), h = Math.max(420, Math.min(760, 1560 - y));
        box = { w: h, h, x: Math.round((1080 - h) / 2), y };
      } else if (el.pos === 'top') {
        box = { w: 560, h: 560, x: 260, y: Math.max(60, Z.top.y0 - 40) };
      } else {
        const free = side === 'left' ? fl : 1080 - fr;
        const w = Math.round(Math.max(380, Math.min(540, free + 70)));
        const h = Math.round(w * 1.15);
        const y = Math.round(Math.max(Z.top.y0 + 150, Math.min(fcy - h * 0.45, Z.captions_y - h - 60)));
        box = { w, h, x: side === 'left' ? 4 : 1080 - w - 4, y: el.y ?? y };
      }
      Object.assign(box, el.box || {});
      el._box = box;
      const depth = el.depth ?? 14;
      const imgs = mode === 'card'
        ? `<div class="card3d"><img src="${esc(el._photo || '')}"></div>`
        : views.map((v, i) => `<div class="view" data-i="${i}" style="position:absolute;inset:0;transform-style:preserve-3d;display:none">` +
            Array.from({ length: depth }, (_, k) => `<img class="lay" src="${esc(v)}" style="transform:translateZ(${(-k * 1.6).toFixed(1)}px);filter:brightness(${(k ? 0.55 - k * 0.012 : 1).toFixed(3)})">`).reverse().join('') +
            `<div class="shine" style="-webkit-mask-image:url('${esc(v)}')"></div></div>`).join('');
      const refl = mode === 'card' ? '' : `<div class="refl"><img class="rimg" src="${esc(views[0] || '')}"></div>`;
      const showInfo = el.info !== false;
      const sizes = (m.sizes || []).slice(0, 5).map(z => `<span class="sz">${esc(z)}</span>`).join('');
      const price = m.price != null && el.price !== false ? `<span class="pr">${esc(el.price_text || (m.price + ' ' + (m.currency === 'RON' ? 'lei' : m.currency)))}</span>` : '';
      // info card: above the product (side) or in the top zone (hero/top) - never in the caption area
      const infoX = el.pos === 'hero' || el.pos === 'top' ? 60 : (side === 'left' ? 30 : Math.max(30, box.x + 10));
      const infoY = el.pos === 'hero' ? Z.top.y0 : el.pos === 'top' ? box.y + box.h + 10 : Math.max(40, box.y - 175);
      if (el.pos === 'hero' && el.hide_captions === undefined) el.hide_captions = true;
      n.innerHTML = `<div class="p3d" style="left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px;${el.glow ? '--pglow:' + esc(el.glow) : ''}">
          <div class="glow"></div><div class="shadow"></div>${refl}<div class="stage">${imgs}</div></div>
        ${showInfo ? `<div class="pinfo" style="left:${infoX}px;top:${infoY}px;max-width:${el.pos === 'hero' || el.pos === 'top' ? 960 : 1080 - infoX - 30}px">
          <div class="pn">${esc(el.name || m.name || '')}</div><div class="row">${price}${sizes}</div>${el.site !== false ? `<div class="site">${esc(el.site_text || 'mindricel.ro')}</div>` : ''}</div>` : ''}`;
    } else if (T === 'checklist') {
      n.innerHTML = `<div class="checklist"><div class="ch-h"><span>${esc(el.title || 'All you need to do')}</span><span class="cnt"></span></div>${el.items.map(it => `<div class="ci"><div class="bx"><svg width="50" height="50"><circle cx="25" cy="25" r="22" fill="#2FBF71" class="fillc" opacity="0"/><path class="ck" d="M14 26 L22 34 L37 17" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40"/></svg></div><span>${esc(it.text ?? it)}</span></div>`).join('')}</div>`;
    }
    n.style.opacity = 0;
    stage.appendChild(n);
    // place in zone + fit
    if (!n.classList.contains('full')) {
      const [y0, y1] = el.y != null ? [el.y, el.y + (el.h || 300)] : (zones[el.pos || 'top'] || zones.top);
      const h = n.offsetHeight, zh = y1 - y0;
      const fit = Math.max(0.5, Math.min(1, zh / h, 1000 / Math.max(1, n.scrollWidth)));
      n.dataset.fit = fit * (el.scale || 1);
      n.style.top = (y0 + zh / 2 - h / 2) + 'px';
    }
    return { el, n, k };
  });

  // ---- caption chunks
  const cs = sb.captions || {};
  const kwSet = new Set((cs.keywords || []).map(normW));
  const kwIdx = new Set(cs.keyword_ids || []);
  const maxW = cs.max_words || (style === 'dp' ? 3 : 4);
  const maxC = cs.max_chars || (style === 'dp' ? 22 : 24);
  const chunks = [];
  let cur = [];
  words.forEach((w, i) => {
    const prev = words[i - 1];
    const chars = cur.reduce((a, x) => a + x.w.length + 1, 0) + w.w.length;
    if (cur.length && (cur.length >= maxW || chars > maxC || /[.!?,;:]$/.test(prev.w) || w.start - prev.end > 0.35)) {
      chunks.push(cur); cur = [];
    }
    cur.push({ ...w, kw: kwSet.has(normW(w.w)) || kwIdx.has(w.i) });
  });
  if (cur.length) chunks.push(cur);
  chunks.forEach((c, i) => {
    c.t0 = c[0].start - 0.04;
    const next = chunks[i + 1];
    c.t1 = next ? Math.min(next[0].start - 0.04, c[c.length - 1].end + 0.6) : c[c.length - 1].end + 0.5;
  });
  const cap = document.createElement('div');
  cap.id = 'cap';
  stage.appendChild(cap);

  S = { sb, style, els, chunks, cap, capY, layer: LAYER, fcx, fcy, face,
        capOn: cs.enabled !== false && LAYER === 'front', mode: cs.mode || (style === 'ed' ? 'karaoke' : 'pop'), lastChunk: -1 };
  return { chunks: chunks.length, elements: els.length };
};

function inOut(t, s, e, tin = 0.32, tout = 0.18) {
  if (t < s || t >= e) return null;
  return { pin: clamp((t - s) / tin), pout: clamp((e - t) / tout), local: t - s };
}

function typed(text, local, cps = 22, delay = 0.25) {
  const n = Math.floor(clamp((local - delay) * cps, 0, text.length));
  return text.slice(0, n);
}

window.renderAt = (t) => {
  const sig = [];
  let hideCaps = false;
  for (const { el, n } of S.els) {
    const st = inOut(t, el.start, el.end, el.in || (el.type === 'flash' ? 0.001 : 0.32), el.out || 0.18);
    if (!st) { if (n.style.opacity !== '0') n.style.opacity = 0; continue; }
    if (el.hide_captions) hideCaps = true;
    const fit = parseFloat(n.dataset.fit || 1);
    const pi = ease.out(st.pin), po = st.pout;
    let op = Math.min(st.pin * 1.6, 1) * po, tr = '';
    switch (el.type) {
      case 'title': {
        if (el.anim === 'drop') {
          [...n.querySelectorAll('.ch')].forEach((c, j) => {
            const p = ease.back(clamp((st.local - j * 0.045) / 0.38));
            c.style.transform = `translateY(${(1 - p) * -90}px)`; c.style.opacity = clamp(p * 2);
            sig.push(p.toFixed(3));
          });
          tr = `scale(${fit})`;
        } else if (el.anim === 'pop') {
          tr = `scale(${fit * (0.82 + 0.18 * ease.back(st.pin))})`;
        } else { // rise (default): each line slides up out of its mask
          [...n.querySelectorAll('.line > span')].forEach((s, j) => {
            const p = ease.out(clamp((st.local - j * 0.09) / 0.38));
            s.style.transform = `translateY(${(1 - p) * 105}%)`;
            sig.push(p.toFixed(3));
          });
          tr = `scale(${fit})`; op = po;
        }
        break;
      }
      case 'prompt': {
        const ty = n.querySelector('.ty');
        const txt = typed(el.text, st.local, el.cps || 24);
        if (ty.textContent !== txt) ty.textContent = txt;
        n.querySelector('.caret').style.opacity = (Math.floor(st.local * 3) % 2 || txt.length < el.text.length) ? 1 : 0;
        tr = `translateY(${(1 - pi) * 40}px) scale(${fit * (0.94 + 0.06 * pi)})`;
        sig.push(txt.length, Math.floor(st.local * 3) % 2);
        break;
      }
      case 'comment': {
        const ty = n.querySelector('.ty');
        const txt = typed(el.text, st.local, 12, 0.5);
        if (ty.textContent !== txt) ty.textContent = txt;
        const rp = n.querySelector('.reply');
        if (rp) rp.style.opacity = clamp((st.local - (el.reply_at || 1.6)) / 0.25);
        tr = `translateY(${(1 - pi) * 40}px) scale(${fit})`;
        sig.push(txt.length, rp ? rp.style.opacity : 0);
        break;
      }
      case 'strike': {
        const p = ease.out(clamp((st.local - (el.strike_at ?? 0.45)) / 0.22));
        n.querySelector('.bar').style.transform = `rotate(-6deg) scaleX(${p})`;
        tr = `scale(${fit * (0.85 + 0.15 * ease.back(st.pin))})`;
        sig.push(p.toFixed(3));
        break;
      }
      case 'counter': {
        const dur = (el.count_end ?? el.end) - el.start;
        const v = el.from + (el.to - el.from) * clamp(st.local / Math.max(0.01, dur));
        const iv = el.to >= el.from ? Math.floor(v) : Math.ceil(v);
        const txt = el.format === 'clock' ? `00:${String(iv).padStart(2, '0')}` : `${el.prefix || ''}${iv}${el.suffix || ''}`;
        const num = n.querySelector('.num');
        if (num.textContent !== txt) num.textContent = txt;
        tr = `scale(${fit * (0.8 + 0.2 * ease.back(st.pin))})`;
        sig.push(txt);
        break;
      }
      case 'list': {
        const items = [...n.querySelectorAll('.it')];
        items.forEach((it, j) => {
          const at = el.items[j]?.at != null ? el.items[j].at - el.start : j * (el.stagger || 0.6);
          const p = ease.out(clamp((st.local - at) / 0.3));
          it.style.opacity = p; it.style.transform = `translateX(${(1 - p) * -60}px)`;
          sig.push(p.toFixed(3));
        });
        tr = `scale(${fit})`;
        break;
      }
      case 'flash': {
        const d = el.end - el.start;
        op = (el.peak ?? 1) * (1 - clamp(st.local / d)) ** 1.5; tr = '';
        break;
      }
      case 'leak': {
        const d = el.end - el.start, p = st.local / d;
        op = Math.sin(Math.PI * clamp(p)) * 0.9;
        tr = `translateX(${(p - 0.5) * 500}px) scale(1.4)`;
        break;
      }
      case 'frame': op = po * pi; break;
      case 'orbit': {
        // cards circle the speaker; the half of the ring "behind" them is drawn on the back layer
        const cards = [...n.querySelectorAll('.orbit-card')];
        const N = cards.length, rx = el.rx || 430, ry = el.ry || 110;
        const ocx = el.cx ?? S.fcx, ocy = el.cy ?? (S.fcy + (el.dy ?? 200));
        const w0 = (el.speed ?? 0.12) * 2 * Math.PI;
        cards.forEach((c, j) => {
          const th = (el.phase || 0) + 2 * Math.PI * j / N + w0 * st.local;
          const z = Math.sin(th);
          const mineSide = (z >= 0) === (S.layer === 'front');
          const sc = (0.72 + 0.28 * (z + 1) / 2) * (el.card_scale || 1) * (0.6 + 0.4 * ease.back(st.pin));
          c.style.opacity = mineSide ? 1 : 0;
          c.style.transform = `translate(${(ocx + rx * Math.cos(th) - 115).toFixed(1)}px, ${(ocy + ry * z - 150 - 40 * Math.cos(th) * 0.3).toFixed(1)}px) scale(${sc.toFixed(3)}) rotate(${(Math.cos(th) * 8).toFixed(2)}deg)`;
          c.style.filter = z < 0 ? `brightness(${(0.75 + 0.25 * (z + 1)).toFixed(2)})` : '';
        });
        op = po; tr = ''; sig.push(st.local.toFixed(3));
        break;
      }
      case 'wall': {
        [...n.querySelectorAll('.note')].forEach((c, j) => {
          const p = ease.back(clamp((st.local - j * (el.stagger ?? 0.12)) / 0.28));
          c.style.opacity = clamp(p * 2).toFixed(2);
          c.style.transform = `rotate(${c.style.getPropertyValue('--r')}) scale(${(0.5 + 0.5 * p).toFixed(3)})`;
          sig.push(p.toFixed(3));
        });
        op = po; tr = '';
        break;
      }
      case 'app': {
        [...n.querySelectorAll('.tile')].forEach((c, j) => {
          const p = ease.back(clamp((st.local - 0.15 - j * 0.12) / 0.3));
          c.style.opacity = clamp(p * 2); c.style.transform = `translateY(${(1 - p) * 40}px)`; sig.push(p.toFixed(3));
        });
        const chip = n.querySelector('.chip');
        if (chip) { const p = ease.back(clamp((st.local - (el.chip_at ?? 0.9)) / 0.25)); chip.style.transform = `scale(${p.toFixed(3)}) rotate(4deg)`; sig.push(p.toFixed(3)); }
        const txt = typed(el.input || '', st.local, el.cps || 22, 0.6);
        const ty = n.querySelector('.ty'); if (ty.textContent !== txt) ty.textContent = txt; sig.push(txt.length);
        tr = `translateY(${(1 - pi) * 60}px) scale(${fit * (0.92 + 0.08 * pi)})`;
        break;
      }
      case 'phone': {
        const ph = n.querySelector('.phone');
        [...n.querySelectorAll('.msg')].forEach((m, j) => {
          const at = el.messages[j].at != null ? el.messages[j].at - el.start : 0.4 + j * 0.7;
          const p = ease.back(clamp((st.local - at) / 0.25));
          m.style.display = p > 0 ? '' : 'none'; m.style.transform = `scale(${(0.7 + 0.3 * p).toFixed(3)})`; m.style.opacity = clamp(p * 2);
          sig.push(p.toFixed(3));
        });
        ph.style.transform = `translateX(${((1 - pi) * (ph.style.left === '40px' ? -480 : 480)).toFixed(1)}px) rotate(${((1 - pi) * 8).toFixed(2)}deg) scale(${el.scale || 0.9})`;
        op = po; tr = ''; sig.push(pi.toFixed(3));
        break;
      }
      case 'chart': {
        const ln = n.querySelector('.ln'), L = ln.getTotalLength();
        const p = ease.inout(clamp((st.local - 0.2) / (el.grow ?? 1.2)));
        ln.style.strokeDasharray = L; ln.style.strokeDashoffset = (L * (1 - p)).toFixed(1);
        const pt = ln.getPointAtLength(L * p), dot = n.querySelector('.pt');
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
        const tag = n.querySelector('.tag');
        if (tag) { const q = ease.back(clamp((st.local - 0.2 - (el.grow ?? 1.2)) / 0.25)); const svg = n.querySelector('svg');
          tag.style.left = (svg.offsetLeft + pt.x - 60) + 'px'; tag.style.top = (svg.offsetTop + pt.y - 70) + 'px'; tag.style.transform = `scale(${q.toFixed(3)})`; sig.push(q.toFixed(3)); }
        tr = `translateY(${(1 - pi) * 50}px) scale(${fit})`; sig.push(p.toFixed(3));
        break;
      }
      case 'backdrop': {
        const p = ease.out(clamp(st.local / 0.32));
        n.firstElementChild.style.clipPath = `inset(0 0 ${((1 - p) * 100).toFixed(2)}% 0)`;
        const tm = n.querySelector('.tm');
        if (tm) { const secs = Math.max(0, Math.round((el.timer ?? 3000) - st.local)); const s2 = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`; if (tm.textContent !== s2) tm.textContent = s2; sig.push(s2); }
        op = po; tr = ''; sig.push(p.toFixed(3));
        break;
      }
      case 'doodle': {
        // hand-drawn shapes that "boil": control points re-jitter 10x per second
        const svg = n.querySelector('svg');
        const boil = Math.floor(t * 10), draw = ease.out(clamp(st.local / 0.35));
        let seed = boil * 9301 + 49297;
        const rr = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280 - 0.5; };
        const J = el.jitter ?? 4;
        const paths = (el.shapes || [{ shape: 'star', x: 200, y: 400 }]).map(sh => {
          const s = sh.size || 140, x = sh.x, y = sh.y, pts = [];
          const P = (px, py) => pts.push([x + px * s + rr() * J, y + py * s + rr() * J]);
          let closed = false;
          switch (sh.shape) {
            case 'star': for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .22 : .5; P(Math.cos(a) * r, Math.sin(a) * r); } break;
            case 'sparkle': for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, r = i % 2 ? .1 : .5; P(Math.cos(a) * r, Math.sin(a) * r); } break;
            case 'circle': for (let i = 0; i <= 26; i++) { const a = i / 24 * 2 * Math.PI; P(Math.cos(a) * .55 * 1.4, Math.sin(a) * .55 * 0.75); } break;
            case 'spiral': for (let i = 0; i <= 40; i++) { const a = i / 40 * 5 * Math.PI, r = .05 + .45 * i / 40; P(Math.cos(a) * r, Math.sin(a) * r); } break;
            case 'arrow': [[-.5, .3], [-.1, .05], [.25, -.1], [.5, -.3]].forEach(q => P(...q)); P(.25, -.32); P(.5, -.3); P(.42, -.06); break;
            case 'underline': for (let i = 0; i <= 8; i++) P(-.8 + i * .2, (i % 2 ? .04 : -.04)); break;
            case 'scribble': for (let i = 0; i <= 14; i++) P(-.6 + i * .085, i % 2 ? .3 : -.3); break;
            case 'x': P(-.3, -.3); P(.3, .3); P(0, 0); P(.3, -.3); P(-.3, .3); break;
            case 'heart': for (let i = 0; i <= 30; i++) { const a = i / 30 * 2 * Math.PI; P(.03 * 16 * Math.sin(a) ** 3, -.03 * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))); } break;
            case 'clapper': P(-.5, -.1); P(.5, -.1); P(.5, .5); P(-.5, .5); P(-.5, -.1); P(-.45, -.45); P(.48, -.62); P(.5, -.25); P(-.5, -.1); P(-.2, -.15); P(-.1, -.5); P(.15, -.2); P(.2, -.56); break;
            default: P(-.5, 0); P(.5, 0);
          }
          const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L') + (closed ? 'Z' : '');
          return `<path d="${d}" fill="none" stroke="${sh.color || el.color || '#fff'}" stroke-width="${sh.width || el.width || 8}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - draw).toFixed(3)}"/>`;
        }).join('');
        svg.innerHTML = paths;
        op = po; tr = ''; sig.push(boil, draw.toFixed(3));
        break;
      }
      case 'tiles': {
        const tl = [...n.querySelectorAll('.tl')];
        tl.forEach((c, j) => { const p = ease.back(clamp((st.local - j * (el.stagger ?? 0.13)) / 0.2)); c.style.opacity = p > 0 ? 1 : 0; c.style.scale = (0.4 + 0.6 * p).toFixed(3); sig.push(p.toFixed(3)); });
        tr = `scale(${fit})`; op = po;
        break;
      }
      case 'glass': {
        const p = ease.out(st.pin);
        n.querySelector('.g2').style.backgroundPosition = `${(120 - 100 * clamp(st.local / 1.6)).toFixed(1)}% 0`;
        tr = `translateY(${((1 - p) * 80).toFixed(1)}px) scale(${(fit * (1.08 - 0.08 * p)).toFixed(4)})`;
        op = po * clamp(st.pin * 1.4); sig.push(st.local.toFixed(3));
        break;
      }
      case 'cover': {
        [...n.querySelectorAll('.mast .ch')].forEach((c, j) => {
          const p = ease.back(clamp((st.local - j * 0.06) / 0.4));
          c.style.transform = `translateY(${((1 - p) * -140).toFixed(1)}px) rotate(${((1 - p) * (j % 2 ? 8 : -8)).toFixed(2)}deg)`; c.style.opacity = clamp(p * 2);
          sig.push(p.toFixed(3));
        });
        op = po; tr = '';
        break;
      }
      case 'product3d': {
        const L = st.local, D = el.end - el.start;
        const stage = n.querySelector('.stage'), p3 = n.querySelector('.p3d');
        const viewsEl = [...n.querySelectorAll('.view')];
        const NV = Math.max(1, viewsEl.length);
        let ang, vi = 0;
        if (el._mode === 'card') {
          ang = -24 + 48 * ease.inout(clamp(L / Math.max(0.5, D)));                // slow sweep for the photo card
        } else if (NV > 1 && el.turntable !== false) {
          const seg = (D - 0.2) / NV, k = Math.min(NV - 1, Math.floor(L / seg));
          vi = k;
          const u = clamp((L - k * seg) / seg) * 2 - 1;                          // -1..1 inside this view
          const spinIn = k === 0 ? Math.max(0, 1 - L / 0.5) : 0;
          ang = 90 * Math.sign(u) * Math.pow(Math.abs(u), 3) * (k === 0 && u < 0 ? (1 - 0.6 * (1 - spinIn)) : 1);
          if (k === 0 && u < 0) ang = -70 * Math.pow(1 - clamp(L / (seg / 2)), 2);  // first view: spin in, settle
          if (k === NV - 1 && u > 0) ang = 22 * Math.sin(u * Math.PI / 2);           // last view: settle, don't exit edge-on
        } else {
          ang = (1 - ease.out(clamp(L / 0.6))) * -120 + 24 * Math.sin(2 * Math.PI * L / 3.4);  // spin-in, then gentle sway
        }
        viewsEl.forEach((v, i) => { const on = i === vi; if ((v.style.display !== 'none') !== on) v.style.display = on ? '' : 'none'; });
        const r = n.querySelector('.rimg'); if (r && viewsEl[vi]) { const src = viewsEl[vi].querySelector('.lay').getAttribute('src'); if (r.getAttribute('src') !== src) r.setAttribute('src', src); }
        const bob = Math.sin(2 * Math.PI * L / 2.2) * 12;
        const ent = ease.back(st.pin);
        stage.style.transform = `translateY(${bob.toFixed(1)}px) rotateX(${(-6).toFixed(1)}deg) rotateY(${ang.toFixed(2)}deg)`;
        p3.style.transform = `scale(${(0.55 + 0.45 * ent).toFixed(3)})`;
        n.querySelector('.shadow').style.transform = `translateX(-50%) scale(${(1 - bob / 90).toFixed(3)})`;
        const sh = viewsEl[vi]?.querySelector('.shine'); if (sh) sh.style.backgroundPosition = `${(130 - 160 * ((L * 0.45) % 1)).toFixed(1)}% 0`;
        const info = n.querySelector('.pinfo');
        if (info) { const q = ease.back(clamp((L - (el.info_at ?? 0.45)) / 0.3)); info.style.opacity = clamp(q * 1.5).toFixed(2); info.style.transform = `translateY(${((1 - q) * 30).toFixed(1)}px)`; sig.push(q.toFixed(3)); }
        op = po; tr = ''; sig.push(L.toFixed(3));
        break;
      }
      case 'checklist': {
        const its = [...n.querySelectorAll('.ci')];
        let done = 0;
        its.forEach((c, j) => {
          const at = el.items[j]?.at != null ? el.items[j].at - el.start : 0.5 + j * (el.stagger ?? 0.7);
          const p = ease.out(clamp((st.local - at) / 0.25));
          if (p > 0.5) done++;
          c.querySelector('.fillc').setAttribute('opacity', p.toFixed(2));
          c.querySelector('.ck').setAttribute('stroke-dashoffset', (40 * (1 - p)).toFixed(1));
          c.style.opacity = (0.45 + 0.55 * p).toFixed(2);
          sig.push(p.toFixed(3));
        });
        const cnt = `${Math.max(1, done)} of ${its.length}`; const ce = n.querySelector('.cnt'); if (ce.textContent !== cnt) ce.textContent = cnt;
        tr = `translateY(${(1 - pi) * 50}px) scale(${fit * (0.92 + 0.08 * ease.back(st.pin))})`;
        break;
      }
      default: // card, step, stat, follow, image, label
        tr = `translateY(${(1 - pi) * 50}px) scale(${fit * (0.9 + 0.1 * ease.back(st.pin))})`;
    }
    n.style.opacity = op.toFixed(3);
    n.style.transform = tr;
    sig.push(op.toFixed(3), tr);
  }

  // captions
  let ci = -1;
  if (S.capOn && !hideCaps) ci = S.chunks.findIndex(c => t >= c.t0 && t < c.t1);
  if (ci < 0) { if (S.cap.innerHTML) S.cap.innerHTML = ''; }
  else {
    const c = S.chunks[ci];
    let html;
    if (S.style === 'ed') {
      const big = c.length <= 2 && c.some(w => w.kw);
      html = `<div class="cap-ed${big ? ' big' : ''}">` + c.map(w =>
        `<span class="w${t >= w.start - 0.02 ? ' on' : ''}${w.kw ? ' kw' : ''}">${esc(w.w)}</span>`).join(' ') + '</div>';
    } else {
      // two-tier: small words on top, keyword(s) huge (blue gradient in depth, yellow in bold)
      const vis = S.mode === 'pop' ? c.filter(w => t >= w.start - 0.03) : c;
      const smalls = vis.filter(w => !w.kw), heroes = vis.filter(w => w.kw);
      const pop = w => { const p = ease.back(clamp((t - w.start + 0.03) / 0.16)); return `transform:scale(${(0.6 + 0.4 * p).toFixed(3)});opacity:${clamp(p * 1.5).toFixed(2)}`; };
      html = `<div class="${S.style === 'bd' ? 'cap-bd' : 'cap-dp'}">` +
        (smalls.length ? `<div class="small">${smalls.map(w => `<span class="w" style="${pop(w)}">${esc(w.w)}</span>`).join('')}</div>` : '') +
        (heroes.length ? `<div>${heroes.map(w => `<span class="w hero" style="${pop(w)}">${esc(w.w)}</span>`).join('')}</div>` : '') + '</div>';
    }
    if (S.cap.innerHTML !== html) S.cap.innerHTML = html;
    const h = S.cap.offsetHeight;
    S.cap.style.top = (S.capY - h / 2) + 'px';
    sig.push(html);
  }
  return sig.join('|');
};
</script>

<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../renderer/fonts.css">
<style>
  :root { --o: #C71425; --o2: #EC3542; --ink: #0A0A0A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: var(--H); overflow: hidden; background: #0A0A0A; }
  body { font-family: 'Inter', sans-serif; color: #fff; position: relative; -webkit-font-smoothing: antialiased; }
  body.post { --H: 1440px; } body.story { --H: 1920px; }

  .bg { position: absolute; inset: 0; background: url(assets/hero-snow.jpg) -525px -330px / 1607px auto no-repeat; }
  .story .bg { background-position: 40% center; background-size: cover; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%),

  /* ---------- Liquid glass ---------- */
  .glass { position: absolute; border-radius: var(--r, 40px); isolation: isolate; overflow: hidden;
    background: linear-gradient(150deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.08) 45%, rgba(255,255,255,.12) 100%), rgba(22,22,24,.32);
    backdrop-filter: url(#refract) blur(20px) saturate(185%) brightness(1.04);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.85),
      inset 1.5px 0 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(255,255,255,.22),
      inset 0 0 24px rgba(255,255,255,.10),
      inset 0 -18px 36px rgba(0,0,0,.12),
      0 24px 60px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.18); }
  /* rim light: gradient hairline border */
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 3;
    background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,.35) 85%, rgba(255,255,255,.8));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  /* specular sheen */
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
    background: radial-gradient(70% 45% at 18% 0%, rgba(255,255,255,.38), transparent 70%),
                radial-gradient(40% 30% at 100% 100%, rgba(255,255,255,.14), transparent 70%); }
  .glass > * { position: relative; z-index: 4; }
  .prize > div:last-child { text-shadow: 0 1px 10px rgba(0,0,0,.35); }
  .glass.orange { background: linear-gradient(150deg, rgba(255,150,80,.55), rgba(255,102,0,.30) 50%, rgba(194,78,0,.40)), rgba(255,102,0,.10);
    box-shadow: inset 0 1.5px 0 rgba(255,220,190,.9), inset 0 0 24px rgba(255,200,150,.18), 0 18px 46px rgba(255,102,0,.35), 0 2px 8px rgba(0,0,0,.2); }

  /* ---------- top bar ---------- */
  .brand { left: 50%; transform: translateX(-50%); top: 44px; height: 92px; --r: 46px; display: flex; align-items: center; gap: 16px; padding: 0 30px 0 14px; }
  .brand .lg { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;

  .brand .lg img { width: 50px; }

  .brand .nm b { color: #FFFFFF; font-weight: 800; }
  .brand .sb { font: 600 17px 'Inter'; opacity: .85; margin-top: 2px; letter-spacing: .02em; }
  .tag { right: 44px; top: 44px; height: 92px; --r: 46px; display: flex; align-items: center; gap: 12px; padding: 0 32px;
    font: 800 26px 'Montserrat'; letter-spacing: .08em; }
  .tag .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.25); }

  /* ---------- title ---------- */

  .kicker { margin-bottom: 4px; font-size: 40px !important; font-weight: 900 !important; letter-spacing: .22em !important;

    background: linear-gradient(160deg, rgba(255,90,100,.95), rgba(199,20,37,.92) 55%, rgba(142,0,13,.95));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -2px 6px rgba(80,0,8,.4), 0 0 26px rgba(255,30,45,.55), 0 10px 24px rgba(0,0,0,.4);
    text-shadow: 0 2px 6px rgba(80,0,8,.6) !important; }
  .kicker { display: inline-block; font: 800 24px 'Montserrat'; letter-spacing: .32em; text-transform: uppercase; padding-left: .32em;
    text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  /* ---------- GIVEAWAY: liquid-glass letters + red neon ---------- */
  .big { position: relative; display: inline-block; margin-top: 10px; font: 900 170px/1 'Montserrat'; letter-spacing: -.01em; }
  .big span { display: block; white-space: nowrap; }
  .big span + span { position: absolute; inset: 0; }
  /* 1. neon halo */
  .big .glow { color: #FF2A3A; text-shadow: 0 0 14px #FF1F30, 0 0 40px rgba(255,20,40,.8), 0 0 90px rgba(255,20,40,.5); }
  /* 2. glass body: frosted copy of the photo behind, sheen + faint red tint */
  .big .body { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(112deg, transparent 0 22%, rgba(255,255,255,.30) 27%, transparent 33%, transparent 61%, rgba(255,255,255,.22) 65%, transparent 70%),
                      linear-gradient(180deg, rgba(255,255,255,.85) 17%, rgba(255,255,255,.42) 28%, rgba(255,255,255,.10) 46%, rgba(255,255,255,0) 64%, rgba(255,110,120,.32) 88%),
                      linear-gradient(rgba(255,40,55,.22), rgba(255,40,55,.22)), url(assets/hero-sblur.jpg);
    background-attachment: scroll, scroll, scroll, fixed; background-repeat: no-repeat; background-size: 100% 100%, 100% 100%, 100% 100%, 1607px auto; background-position: 0 0, 0 0, 0 0, -525px -330px; }
  .story .big .body { background-position: 0 0, 0 0, 0 0, 40% center; background-size: 100% 100%, 100% 100%, 100% 100%, cover; }
  /* 3. neon tube on the outline */
  .big .tube { color: #000; filter: url(#tubeF); }
  .big .shade { color: #000; filter: url(#shadeF); }
  /* 4. white specular rim on the top edge */
  .big .rim { color: #000; filter: url(#rimF); opacity: .95; }
  .story .big { font-size: 172px; }
  .big2 { font: 800 64px/1 'Montserrat'; letter-spacing: .14em; padding-left: .14em; margin-top: 6px; text-shadow: 0 3px 18px rgba(0,0,0,.55); }
  .story .big2 { font-size: 70px; }
  .sub { display: inline-block; margin-top: 24px; padding: 18px 42px; border-radius: 999px; font: 800 44px 'Montserrat';

    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(255,255,255,.15), inset 0 0 18px rgba(255,255,255,.06), 0 12px 30px rgba(0,0,0,.35); }
  .sub b { color: var(--o2); }

  /* ---------- prizes ---------- */
  .prize { display: flex; align-items: center; }
  .prize .img { flex: none; display: grid; place-items: center; }

  .rank { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 6px; border-radius: 20px;

  .rank i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 900 17px 'Montserrat'; letter-spacing: 0;
    background: linear-gradient(160deg, #EC3542, #C71425 55%, #8E000D); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }

  /* voucher ticket */
  .voucher { position: relative; width: 100%; aspect-ratio: 1.62; display: flex; border-radius: 16px; overflow: hidden; transform: rotate(-6deg);
    background: linear-gradient(150deg, #F2414E, #C71425 55%, #8E000D);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 0 22px rgba(255,30,45,.5), 0 12px 22px rgba(0,0,0,.4); color: #fff; }
  .voucher::before, .voucher::after { content: ""; position: absolute; left: 74%; width: 18%; aspect-ratio: 1; margin-left: -9%; border-radius: 50%; background: rgba(60,60,64,.9); }
  .voucher::before { top: -9%; } .voucher::after { bottom: -9%; }

  .voucher .vn { font: 900 1em/1 'Montserrat'; letter-spacing: -.03em; text-shadow: 0 2px 6px rgba(80,0,8,.5); }

  /* product tiles: one item per tile, same size, aligned */
  .prize .img.tiles { display: grid; gap: var(--tg, 10px); background: none; border-radius: 0; place-items: stretch; }
  .tiles.t4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
